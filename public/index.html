<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日脉络</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='16' width='64' height='64' fill='%234f6cf7'/%3E%3Cpath d='M15 38l10-10 8 7 16-17M15 48h34' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo">⌁</span><div><b>今日脉络</b><small>把电脑痕迹整理成真正做过的事</small></div></div><nav><button id="prev" title="前一天">‹</button><input id="date" type="date"><button id="next" title="后一天">›</button></nav><div class="actions"><button id="theme">◐</button><button id="settings">设置</button><button class="primary" id="scan">扫描今天</button></div></header>
<main><section class="hero"><div><span class="eyebrow">TODAY · <span id="dateLabel"></span></span><h1 id="headline">今天做了什么，一眼看清。</h1><p id="summary">选择日期并开始扫描。只读取文件元数据；AI 默认关闭，只有你主动点击才会发送整理后的证据。</p></div><div class="score"><b id="activityCount">0</b><span>件事</span></div></section>
<div id="progress" class="progress hidden"><i></i><span>正在检查…</span></div>
<section class="metrics"><div><span>文件证据</span><b id="mFiles">0</b></div><div><span>聚合事项</span><b id="mActs">0</b></div><div><span>扫描目录</span><b id="mDirs">0</b></div><div><span>扫描状态</span><b id="mState">未扫描</b></div></section>
<div class="toolbar"><div class="tabs"><button class="active" data-view="activities">智能归纳</button><button data-view="timeline">证据时间线</button></div><div><button id="ai">AI 深度归纳</button><button id="copy">复制 Markdown</button><button id="export">导出 JSON</button></div></div>
<section id="content" class="content"><div class="empty"><b>还没有今天的脉络</b><span>扫描 C、D、E 盘今天新建或修改的内容，再自动合并同一任务。</span></div></section></main>
<dialog id="settingsDialog"><form method="dialog"><div class="dialogHead"><h2>扫描与 AI 设置</h2><button value="cancel">×</button></div><label>扫描盘符<div class="checks"><label><input type="checkbox" name="drive" value="C:">C 盘</label><label><input type="checkbox" name="drive" value="D:">D 盘</label><label><input type="checkbox" name="drive" value="E:">E 盘</label></div></label><label>排除目录（每行一个）<textarea id="excludes" rows="4" placeholder="C:\Windows\Temp"></textarea></label><div class="two"><label>兼容 OpenAI 的 API 地址<input id="endpoint" placeholder="https://api.openai.com/v1"></label><label>模型<input id="model" placeholder="gpt-5-mini"></label></div><label>API Key<input id="apiKey" type="password" autocomplete="off" placeholder="仅保存在本机"></label><p class="privacy">隐私提示：扫描只读取路径、大小和时间；AI 仅在你点击“AI 深度归纳”时发送文件名与本地初步归纳，不发送文件内容。</p><div class="dialogActions"><button value="cancel">取消</button><button id="saveSettings" value="default" class="primary">保存设置</button></div></form></dialog>
<script src="app.js"></script></body></html>
